    body {

    .scroll-reveal {
      opacity: 0;

    }
    
    .scroll-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-100 { transition-delay: 100ms; }
    .delay-200 { transition-delay: 200ms; }
    
    .mockup-3d {
      transform: translateZ(0) rotateY(-15deg) rotateX(5deg) rotateZ(2deg);

      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mockup-3d:hover {
      transform: translateZ(0) rotateY(0) rotateX(0) rotateZ(0) scale(1.02);

    /* Hide scrollbar for clean mockups */

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const useScrollReveal = () => {
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
        );
        
        const elements = document.querySelectorAll('.scroll-reveal');
        elements.forEach(el => observer.observe(el));
        
        return () => {
          elements.forEach(el => observer.unobserve(el));
        };
      }, []);
      return ref;
    };

    const Navbar = () => {
      return (
        <nav className="fixed top-0 left-0 right-0 z-50 glass-nav transition-all duration-300">
          <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" className="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
              <img src="images/logo.png" alt="Espere Logo" className="w-10 h-10 object-contain rounded-xl shadow-soft" />
              <span className="font-black text-2xl tracking-tight text-dark">Espere</span>
            </a>
            
            <div className="hidden md:flex items-center gap-6 text-[15px] font-bold text-dark/60">
              <a href="/#features" className="hover:text-dark transition-colors">Features</a>
              <a href="about.html" className="hover:text-dark transition-colors">About</a>
              <a href="faq.html" className="hover:text-dark transition-colors">FAQ</a>
              <a href="privacy.html" className="hover:text-dark transition-colors">Privacy Policy</a>
              <a href="terms.html" className="hover:text-dark transition-colors">Terms of Service</a>
              <a href="contact.html" className="text-dark border-b-2 border-dark pb-1 hover:text-dark transition-colors">Contact Support</a>
            </div>
            
            <div>
              <a href="espere.apk" download className="inline-block bg-brand hover:bg-brand-hover text-dark font-bold px-7 py-3 rounded-btn transition-all duration-300 hover:shadow-glow transform hover:-translate-y-0.5">
                Download App
              </a>
            </div>
          </div>
        </nav>
      );
    };


    const PageContent = () => {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        type: 'support',
        message: '',
        captcha_answer: ''
      });
      const [captcha, setCaptcha] = useState({ question: '', token: '' });
      const [loadingCaptcha, setLoadingCaptcha] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [status, setStatus] = useState({ type: '', message: '' });

      const fetchCaptcha = async () => {
        setLoadingCaptcha(true);
        try {
          // Pointing directly to the hosted API URL to avoid CORS/path issues
          const res = await fetch('https://montra.pythonanywhere.com/api/contact/captcha/');
          if (res.ok) {
            const data = await res.json();
            setCaptcha({ question: data.question, token: data.token });
            setFormData(prev => ({ ...prev, captcha_answer: '' }));
          }
        } catch (err) {
          console.error("Failed to load captcha", err);
        } finally {
          setLoadingCaptcha(false);
        }
      };

      useEffect(() => {
        fetchCaptcha();
      }, []);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        setStatus({ type: '', message: '' });

        try {
          const payload = {
            ...formData,
            captcha_token: captcha.token
          };

          const res = await fetch('https://montra.pythonanywhere.com/api/contact/submit/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();

          if (res.ok) {
            setStatus({ type: 'success', message: data.message });
            setFormData({ name: '', email: '', type: 'support', message: '', captcha_answer: '' });
            fetchCaptcha(); // Refresh captcha after success
          } else {
            setStatus({ type: 'error', message: data.error || 'Something went wrong.' });
            if (data.error && data.error.toLowerCase().includes('captcha')) {
              fetchCaptcha(); // Refresh captcha if they got it wrong
            }
          }
        } catch (err) {
          setStatus({ type: 'error', message: 'Network error. Please try again later.' });
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <section className="pt-32 pb-24 px-6 min-h-screen relative overflow-hidden">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-brand/15 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
          <div className="max-w-4xl mx-auto">
            <h1 className="text-4xl md:text-5xl font-black mb-8">Contact Support</h1>
            <p className="text-dark/70 text-lg mb-8 font-medium">Have a bug report, question, or feedback? We're here for you.</p>
            
            <div className="bg-white p-8 rounded-[32px] shadow-sm border border-black/5 flex flex-col md:flex-row gap-12">
               <div className="flex-1">
                 <h3 className="text-2xl font-bold mb-6">Send us a message</h3>
                 
                 {status.message && (
                   <div className={`mb-6 p-4 rounded-xl border font-medium ${status.type === 'success' ? 'bg-[#E8F5E9] text-[#4CAF50] border-[#4CAF50]/20' : 'bg-[#FFFFEBEE] text-[#C62828] border-[#C62828]/20'}`}>
                     {status.message}
                   </div>
                 )}

                 <form className="space-y-5" onSubmit={handleSubmit}>
                   <div>
                     <label className="block text-sm font-bold mb-2 text-dark">Name</label>
                     <input type="text" name="name" value={formData.name} onChange={handleChange} required className="w-full bg-[#F5F5F5] rounded-xl px-4 py-3 border border-black/5 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" placeholder="Your name" />
                   </div>
                   
                   <div className="flex flex-col md:flex-row gap-5">
                     <div className="flex-1">
                       <label className="block text-sm font-bold mb-2 text-dark">Email</label>
                       <input type="email" name="email" value={formData.email} onChange={handleChange} required className="w-full bg-[#F5F5F5] rounded-xl px-4 py-3 border border-black/5 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" placeholder="Your email address" />
                     </div>
                     <div className="flex-1">
                       <label className="block text-sm font-bold mb-2 text-dark">Type</label>
                       <select name="type" value={formData.type} onChange={handleChange} className="w-full bg-[#F5F5F5] rounded-xl px-4 py-3 border border-black/5 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all cursor-pointer">
                         <option value="support">General Support</option>
                         <option value="bug_report">Bug Report</option>
                         <option value="feedback">Feedback</option>
                       </select>
                     </div>
                   </div>

                   <div>
                     <label className="block text-sm font-bold mb-2 text-dark">Message</label>
                     <textarea name="message" value={formData.message} onChange={handleChange} rows="4" required className="w-full bg-[#F5F5F5] rounded-xl px-4 py-3 border border-black/5 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" placeholder="How can we help? Or describe the bug..."></textarea>
                   </div>
                   
                   <div>
                     <label className="block text-sm font-bold mb-2 text-dark">Verification: {loadingCaptcha ? 'Loading...' : captcha.question}</label>
                     <div className="flex gap-3">
                       <input type="number" name="captcha_answer" value={formData.captcha_answer} onChange={handleChange} required disabled={loadingCaptcha} className="w-32 bg-[#F5F5F5] rounded-xl px-4 py-3 border border-black/5 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all" placeholder="Answer" />
                       <button type="button" onClick={fetchCaptcha} disabled={loadingCaptcha} className="text-sm font-bold text-dark/50 hover:text-dark px-3 py-2 transition-colors">
                         <i className="ph-bold ph-arrows-clockwise text-xl"></i>
                       </button>
                     </div>
                   </div>

                   <button type="submit" disabled={isSubmitting || loadingCaptcha} className="bg-dark text-[#C8E64A] font-black px-6 py-4 rounded-xl hover:bg-black transition-colors w-full shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                     {isSubmitting ? 'Sending...' : 'Send Message'}
                   </button>
                 </form>
               </div>
               
               <div className="hidden md:flex w-full md:w-1/3 justify-center items-center">
                 <div className="relative w-[300px] h-[600px] bg-[#111] rounded-[48px] border-[12px] border-[#222] shadow-2xl overflow-hidden transition-transform duration-500 hover:-translate-y-2">
                   {/* Hardware Buttons */}
                   <div className="absolute -right-[14px] top-28 w-1 h-12 bg-[#333] rounded-l-md"></div>
                   <div className="absolute -right-[14px] top-44 w-1 h-24 bg-[#333] rounded-l-md"></div>
                   
                   {/* Punch Hole Camera */}
                   <div className="absolute top-4 left-1/2 -translate-x-1/2 w-4 h-4 bg-black rounded-full z-30 shadow-inner"></div>
                   
                   {/* Screen Content - Splash Screen */}
                   <div className="absolute inset-0 bg-[#1A1A1A] text-white flex flex-col items-center justify-between z-20 overflow-hidden">
                     <div className="flex-1 flex flex-col items-center justify-center w-full">
                       <img src="images/logo.png" alt="Espere Logo" className="w-32 h-32 object-contain transform hover:scale-110 transition-transform duration-500" />
                     </div>
                     
                     <div className="w-full px-6 pb-8">
                       <a href="espere.apk" download className="flex items-center justify-center gap-2 w-full bg-[#C8E64A] hover:bg-[#D9F260] text-[#1A1A1A] font-black py-2 rounded-[14px] shadow-glow transition-all duration-300 transform hover:-translate-y-1">
                         <i className="ph-bold ph-download-simple text-xl"></i>
                         <span>Download App</span>
                       </a>
                     </div>
                   </div>
                 </div>
               </div>
            </div>
          </div>
        </section>
      )
    }

    const Footer = () => {
      return (
        <footer className="bg-white border-t border-black/5 py-16 px-6 mt-12">
          <div className="max-w-7xl mx-auto">
            <div className="flex flex-col md:flex-row items-center justify-between gap-8 mb-12">
              <div className="flex items-center gap-3">
                <img src="images/logo.png" alt="Espere Logo" className="w-8 h-8 object-contain rounded-lg shadow-soft" />
                <span className="font-black text-xl tracking-tight">Espere</span>
              </div>
              
              <div className="flex flex-wrap justify-center gap-8 text-sm font-bold text-dark/70">
                <a href="/#features" className="hover:text-brand transition-colors">Features</a>
                <a href="about.html" className="hover:text-brand transition-colors">About</a>
                <a href="privacy.html" className="hover:text-brand transition-colors">Privacy Policy</a>
                <a href="terms.html" className="hover:text-brand transition-colors">Terms of Service</a>
                <a href="contact.html" className="hover:text-brand transition-colors">Contact Support</a>
              </div>
              
              <div className="flex gap-5">
                <a href="#" className="text-dark/50 hover:text-brand transition-colors transform hover:scale-110">
                  <i className="ph-fill ph-twitter-logo text-2xl"></i>
                </a>
                <a href="#" className="text-dark/50 hover:text-brand transition-colors transform hover:scale-110">
                  <i className="ph-fill ph-instagram-logo text-2xl"></i>
                </a>
                <a href="#" className="text-dark/50 hover:text-brand transition-colors transform hover:scale-110">
                  <i className="ph-fill ph-linkedin-logo text-2xl"></i>
                </a>
              </div>
            </div>
            
            <div className="text-center text-sm font-medium text-muted pt-8 border-t border-black/5">
              &copy; {new Date().getFullYear()} Espere Inc. All rights reserved.
            </div>
          </div>
        </footer>
      );
    };

    const App = () => {
      useScrollReveal();
      
      return (
        <div className="font-sans antialiased text-dark selection:bg-brand/30 selection:text-dark">
          <Navbar />
          <main>
            <PageContent />
            
            
          </main>
          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  </body>
