<body>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const useScrollReveal = () => {
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
        );
        
        const elements = document.querySelectorAll('.scroll-reveal');
        elements.forEach(el => observer.observe(el));
        
        return () => {
          elements.forEach(el => observer.unobserve(el));
        };
      }, []);
      return ref;
    };

              <a href="terms.html" className="hover:text-dark transition-colors">Terms of Service</a>
              <a href="contact.html" className="hover:text-dark transition-colors">Contact Support</a>
            </div>
            
            <div>
              <a href="espere.apk" download className="inline-block bg-brand hover:bg-brand-hover text-dark font-bold px-7 py-3 rounded-btn transition-all duration-300 hover:shadow-glow transform hover:-translate-y-0.5">
                Download App
              </a>
            </div>
          </div>
        </nav>
      );
    };


    const PageContent = () => {
      const sections = [
        {
          icon: "ph-database",
          title: "1. Information We Collect",
          content: (
            <div className="space-y-4">
              <p>We collect information to provide you with a seamless financial tracking experience:</p>
              <ul className="list-disc pl-5 space-y-2 text-dark/80">
                <li><strong>Account Information:</strong> Name, email address, and profile picture (if provided) when you sign up.</li>
                <li><strong>Financial Data:</strong> Expenses, budgets, bills, and transaction details that you manually input into the app.</li>
                <li><strong>Group Data:</strong> Information about the groups you create or join, and how expenses are split among members.</li>
                <li><strong>Device Information:</strong> We use Firebase Cloud Messaging (FCM) to send push notifications. We securely store an anonymous device token to deliver these notifications.</li>
              </ul>
            </div>
          )
        },
        {
          icon: "ph-shield-check",
          title: "2. How We Use Your Data",
          content: (
            <div className="space-y-4">
              <p>Your data is used strictly to make Espere work for you:</p>
              <ul className="list-disc pl-5 space-y-2 text-dark/80">
                <li>To sync your offline expenses to the cloud when you reconnect.</li>
                <li>To accurately calculate group settlements and debts.</li>
                <li>To send you important notifications regarding group invites or expense updates.</li>
              </ul>
              <div className="bg-brand/10 p-4 rounded-xl border border-brand/20 mt-4">
                <p className="font-bold text-dark flex items-center gap-2">
                  <i className="ph-fill ph-warning-circle text-brand text-xl"></i>
                  Zero Data Selling Policy
                </p>
                <p className="text-sm mt-1">We will <strong>never</strong> sell, rent, or trade your personal or financial data to third-party advertisers, data brokers, or anyone else.</p>
              </div>
            </div>
          )
        },
        {
          icon: "ph-users",
          title: "3. Information Sharing",
          content: (
            <div className="space-y-4">
              <p>Because Espere is designed for group expense splitting, some of your data is shared with other users by design:</p>
              <ul className="list-disc pl-5 space-y-2 text-dark/80">
                <li>When you add an expense to a group, all members of that group can see the expense details and who paid for it.</li>
                <li>Your profile name and email are visible to people you invite to groups.</li>
                <li>Outside of the groups you explicitly join, your data is completely private.</li>
              </ul>
            </div>
          )
        },
        {
          icon: "ph-lock-key",
          title: "4. Data Security & Storage",
          content: (
            <p className="text-dark/80 leading-relaxed">
              We implement industry-standard encryption protocols to protect your data in transit (via HTTPS) and at rest. Because Espere utilizes an <strong>Offline-First Architecture</strong>, a local copy of your data is securely stored on your device using encrypted local databases. You are responsible for keeping your physical device secure.
            </p>
          )
        },
        {
          icon: "ph-github-logo",
          title: "5. Open Source Transparency",
          content: (
            <p className="text-dark/80 leading-relaxed">
              Espere is proudly Open Source. This means our codebase is publicly available for auditing. Any developer can inspect our code on GitHub to verify exactly how data is handled and ensure there are no hidden trackers or malicious data collection practices.
            </p>
          )
        },
        {
          icon: "ph-export",
          title: "6. Your Rights & Data Export",
          content: (
            <div className="space-y-4">
              <p className="text-dark/80 leading-relaxed">
                You have total ownership of your data. At any time, you can:
              </p>

                <li><strong>Export your data:</strong> Generate high-fidelity PDF reports of all your personal and group expenses.</li>
                <li><strong>Delete your account:</strong> You can permanently delete your account and all associated data directly from the app settings.</li>
              </ul>
            </div>
          )
        }
      ];

      return (

          <div className="max-w-4xl mx-auto">
            {/* Header */}
            <div className="text-center mb-16 scroll-reveal">

                We believe your financial data belongs to you, and only you. Here is exactly how we handle, protect, and secure your information.

            {/* Content */}
            <div className="space-y-8">

            {/* Contact CTA */}

              <p className="text-white/70 mb-8 max-w-lg mx-auto">We're always here to help. Reach out to our support team if you have any questions about how your data is handled.</p>
              <a href="contact.html" className="inline-block bg-brand hover:bg-brand-hover text-dark font-black px-8 py-4 rounded-2xl transition-transform hover:-translate-y-1 duration-300 shadow-glow">
                Contact Us
              </a>
            </div>

          </div>
        </section>
      )
    }

    const Footer = () => {
      return (
        <footer className="bg-white border-t border-black/5 py-16 px-6 mt-12">
          <div className="max-w-7xl mx-auto">
            <div className="flex flex-col md:flex-row items-center justify-between gap-8 mb-12">
              <div className="flex items-center gap-3">
                <img src="images/logo.png" alt="Espere Logo" className="w-8 h-8 object-contain rounded-lg shadow-soft" />
                <span className="font-black text-xl tracking-tight">Espere</span>
              </div>
              
              <div className="flex flex-wrap justify-center gap-8 text-sm font-bold text-dark/70">
                <a href="/#features" className="hover:text-brand transition-colors">Features</a>
                <a href="about.html" className="hover:text-brand transition-colors">About</a>
                <a href="privacy.html" className="hover:text-brand transition-colors">Privacy Policy</a>
                <a href="terms.html" className="hover:text-brand transition-colors">Terms of Service</a>
                <a href="contact.html" className="hover:text-brand transition-colors">Contact Support</a>
              </div>
              
              <div className="flex gap-5">
                <a href="#" className="text-dark/50 hover:text-brand transition-colors transform hover:scale-110">

    const App = () => {
      useScrollReveal();
      
      return (
        <div className="font-sans antialiased text-dark selection:bg-brand/30 selection:text-dark">

    root.render(<App />);
  </script>
